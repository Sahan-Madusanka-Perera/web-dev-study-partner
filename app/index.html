<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="An interactive course for G.C.E. A/L ICT Competency 10 — build real web pages, run real PHP, query a real database, right in the browser." />
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1018" media="(prefers-color-scheme: dark)" />
    <link rel="preload" href="/fonts/newsreader-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Web Dev Study Partner</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('wdsp.theme')
          if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
            document.documentElement.dataset.theme = 'dark'
          else document.documentElement.dataset.theme = 'light'
        } catch (e) { document.documentElement.dataset.theme = 'light' }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
